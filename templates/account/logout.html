{% extends "base.html" %}

{% block title %}
<title>Vinyl Online - Confirm Log Out</title>
{% endblock %}


{% block content %}
<!-- Log Out -->
<div class="container mt-2 mb-5 pb-5">
    <div class="row">
        <div class="col-12 col-md-4 text-center mx-auto">
            <h1 class="text-white category-header text-center mb-5">Sign Out</h1>
            <p class="text-white">Are you sure you want to log out of your account?</p>
            <form method="POST" action="{% url 'account_logout' %}" class="mb-5 pb-5">
                {% csrf_token %}
                    <button type="submit" class="btn btn-danger mb-5">Log Out</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
